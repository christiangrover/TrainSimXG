[package]
name = "trainsim"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16.1", features = ["wav"] }
bevy_egui = "0.35.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Bevy is very slow in debug builds; optimize dependencies even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
